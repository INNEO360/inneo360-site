<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Inneo 360 — Votre COO Externalisé</title>
  <meta http-equiv="refresh" content="6; url=https://inneo-operates-smoothly.lovable.app" />
  <style>
    :root { color-scheme: light dark; }
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.5;
      display:grid;place-items:center;min-height:100vh;padding:24px;
      background:radial-gradient(1200px 600px at 20% 10%, rgba(0,0,0,.08), transparent),
                 radial-gradient(1200px 600px at 80% 90%, rgba(0,0,0,.08), transparent);}
    .card{max-width:720px;width:100%;padding:28px;border:1px solid rgba(127,127,127,.25);
      border-radius:16px;background:rgba(255,255,255,.75);backdrop-filter:blur(6px);}
    @media (prefers-color-scheme: dark){.card{background:rgba(20,20,20,.6);}}
    h1{margin:0 0 10px;font-size:28px;}
    p{margin:0 0 14px;font-size:16px;opacity:.92;}
    .cta{display:inline-block;margin-top:10px;padding:12px 16px;border-radius:12px;
      border:1px solid rgba(127,127,127,.35);text-decoration:none;font-weight:650;}
    .small{font-size:13px;opacity:.75;margin-top:12px;}
    .brand{opacity:.7;font-weight:600;letter-spacing:.2px;}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Inneo 360</div>
    <h1>Le prochain chapitre est en train de s’écrire.</h1>
    <p>
      Nouveau site en construction, accessible, prise de RDV intégrée.
    </p>
    <a class="cta" href="https://inneo-operates-smoothly.lovable.app" target="_blank" rel="noopener">
      Me contacter sur LinkedIn
    </a>
    <p class="small">
      Redirection automatique vers Le site dans quelques secondes…
      (Si ça ne bouge pas, clique sur le bouton.)
    </p>
  </main>
  <script>
    const url = "https://ca.linkedin.com/company/inneo-360";
    setTimeout(() => { window.location.href = url; }, 6500);
  </script>
</body>
</html>
